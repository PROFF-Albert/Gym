<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ELEV8 </title>
    <link rel="stylesheet" href="gym.css">
</head>

<body>

    <header class="nav-inner" id="site-header">
        <div class="container navbar">
            <a class="logo" href="index.html">ELEV<span>8</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="gyms.html">Find Gyms</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
            <div class="nav-action">
                <a href="signup.html" class="btn">Sign Up</a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <nav class="mobile-nav" id="mobile-nav">
        <a href="index.html">Home</a>
        <a href="gyms.html">Find Gyms</a>
        <a href="login.html">Login</a>
        <a href="signup.html" class="btn">Sign Up</a>
    </nav>

    <div class="page-offset"></div>

    <div class="form-page">
        <div class="container">
            <div class="form-container">
                <h1 class="section-title">Welcome back</h1>
                <p class="form-subtitle">Sign in to your ELEV8 account.</p>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <button type="button" class="btn form-btn-full" onclick="window.location.href='userdashboard.html'">
                    Sign In
                </button>

                <p class="form-footer" style="margin-top:20px">
                    Don't have an account? <a href="signup.html">Create one free</a>
                </p>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-inner">
                <span class="footer-logo">ELEV<span>8</span></span>
                <span>© 2026 ELEV8. All rights reserved.</span>
            </div>
        </div>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const mobileNav = document.getElementById('mobile-nav');
        hamburger.addEventListener('click', () => mobileNav.classList.toggle('open'));
    </script>
</body>

</html>
